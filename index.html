const SUBJECTS={
 comp:{name:"Computer Studies",short:"Computer",TOP:CP_TOP,OBJ:CP_OBJ,THY:CP_THY},
 home:{name:"Home Economics",short:"Home Ec",TOP:HE_TOP,OBJ:HE_OBJ,THY:HE_THY},
 civic:{name:"Civic Education",short:"Civic",TOP:CV_TOP,OBJ:CV_OBJ,THY:CV_THY},

 sec:{name:"Security Education",short:"Security",TOP:SE_TOP,OBJ:SE_OBJ,THY:SE_THY}
};
let TOP,OBJ,THY,SUBJ="comp";
const setSub=k=>{SUBJ=k;({TOP,OBJ,THY}=SUBJECTS[k])};setSub("comp");
const $=s=>document.querySelector(s), app=$("#app"), MINS=45, NOBJ=15, NTHY=3;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let S=null,timer=null;
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const hist=()=>{try{return JSON.parse(lsGet("jss3ca2hist")||"[]")}catch(e){return[]}};
const saveRec=r=>{const h=hist(),i=h.findIndex(x=>x.id===r.id);if(i>=0)h[i]=r;else h.unshift(r);lsSet("jss3ca2hist",JSON.stringify(h.slice(0,200)))};
const tg=$("#tg"),curTheme=()=>document.documentElement.dataset.theme;
const icon=()=>tg.textContent=curTheme()==="dark"?"☀️":"🌙";icon();
tg.onclick=()=>{const n=curTheme()==="dark"?"light":"dark";document.documentElement.dataset.theme=n;try{localStorage.setItem("jss3theme",n)}catch(e){}icon()};

function home(){
  clearInterval(timer);S=null;app.onchange=app.oninput=null;
  const h=hist();
  app.innerHTML=`<div class="card"><h2 style="margin-top:0">Start a mock test</h2>
  <label for="s">Subject</label>
  <select id="s">${Object.entries(SUBJECTS).map(([k,v])=>`<option value="${k}" ${k===SUBJ?"selected":""} ${v.OBJ.length?"":"disabled"}>${v.name}</option>`).join("")}</select>
  <p class="note">${NOBJ} objective + ${NTHY} theory questions, ${MINS} minutes, drawn at random from ${OBJ.length} objective and ${THY.length} theory questions.</p>
  <p class="note"><a href="ca1.html">Archived: Mock CA 1 (first CA subjects)</a></p>
  <label for="t">Topic</label>
  <select id="t"><option value="all">All topics (standard test)</option>${Object.entries(TOP).map(([k,v])=>`<option value="${k}">${v} only</option>`).join("")}</select>
  <button id="go">Start test</button><button class="alt" id="pp">Print a paper with answer key</button><button class="alt" id="rp">📊 My report (${h.length} test${h.length===1?"":"s"})</button></div>`;
  $("#s").onchange=e=>{setSub(e.target.value);home()};
  $("#go").onclick=()=>start($("#t").value);
  $("#pp").onclick=()=>printPaper($("#t").value);$("#rp").onclick=report;
}

const pool=topic=>{const f=a=>topic==="all"?a:a.filter(q=>q[0]===topic);let th=f(THY);if(!th.length)th=THY;return{o:shuf(f(OBJ)).slice(0,NOBJ),t:shuf(th).slice(0,NTHY)}};
const mkO=q=>({src:q,t:q[0],q:q[1],a:q[2],o:shuf(q.slice(2)),p:null});
const mkT=q=>({t:q[0],q:q[1],max:q[2],pts:q[3],txt:"",tk:[]});
function begin(o,t,mins,label){
  S={label,subj:SUBJ,id:Date.now(),t0:Date.now(),done:false,end:Date.now()+mins*60000,obj:o.map(mkO),thy:t.map(mkT)};
  scrollTo(0,0);renderTest();timer=setInterval(tick,1000);tick();
}
const start=topic=>{const p=pool(topic);begin(p.o,p.t,MINS,topic==="all"?"All topics":TOP[topic])};

function renderTest(){
  app.innerHTML=`<div class="bar" id="bar"><span id="tm"></span><span id="pr"></span></div>
  <h2>Section A: Objective</h2>
  ${S.obj.map((q,i)=>`<div class="card"><div class="tag">Question ${i+1} · ${TOP[q.t]}</div><p class="q">${esc(q.q)}</p>
  ${q.o.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" data-i="${i}" value="${j}"><span>${esc(o)}</span></label>`).join("")}</div>`).join("")}
  ${S.thy.length?`<h2>Section B: Theory</h2><p class="note">Write your answers here. You will mark them yourself against the guide after submitting.</p>
  ${S.thy.map((q,i)=>`<div class="card"><div class="tag">Theory ${i+1} · ${q.max} marks</div><p class="q">${esc(q.q)}</p><textarea data-t="${i}" placeholder="Type your answer…"></textarea></div>`).join("")}`:""}
  <button id="sub">Submit test</button>`;
  app.onchange=e=>{const i=e.target.dataset.i;if(i!==undefined&&!S.done){S.obj[i].p=+e.target.value;prog()}};
  app.oninput=e=>{const t=e.target.dataset.t;if(t!==undefined&&!S.done)S.thy[t].txt=e.target.value};
  $("#sub").onclick=()=>submit(false);prog();
}
const prog=()=>{const n=S.obj.filter(q=>q.p!==null).length;$("#pr").textContent=`${n}/${S.obj.length} answered`};

function tick(){
  const r=S.end-Date.now();
  if(r<=0){submit(true);return}
  const m=Math.floor(r/60000),s=Math.floor(r%60000/1000);
  $("#tm").textContent=`⏱ ${m}:${String(s).padStart(2,"0")}`;
  $("#bar").classList.toggle("warn",r<5*60000);
}

function submit(auto){
  const un=S.obj.filter(q=>q.p===null).length;
  if(!auto&&un&&!confirm(`${un} objective question(s) unanswered. Submit anyway?`))return;
  clearInterval(timer);S.done=true;
  S.score=S.obj.filter(q=>q.o[q.p]===q.a).length;
  const tp={};S.obj.forEach(q=>{const c=tp[q.t]=tp[q.t]||[0,0];c[1]++;if(q.o[q.p]===q.a)c[0]++});
  S.rec={id:S.id,ts:Date.now(),subj:S.subj,label:S.label,s:S.score,n:S.obj.length,sec:Math.round((Date.now()-S.t0)/1000),tp,th:null,tmax:S.thy.reduce((a,q)=>a+q.max,0)};saveRec(S.rec);
  scrollTo(0,0);renderResult(auto);
}

function renderResult(auto){
  const n=S.obj.length,pc=Math.round(S.score/n*100);
  const tmax=S.thy.reduce((a,q)=>a+q.max,0);
  const missed=S.obj.filter(q=>q.o[q.p]!==q.a);
  app.onchange=e=>{const i=e.target.dataset.i,k=e.target.dataset.k;if(k!==undefined){S.thy[i].tk[k]=e.target.checked;calc(true)}};
  app.oninput=null;
  app.innerHTML=`${auto?`<div class="card"><b>Time is up.</b> Your test was submitted automatically.</div>`:""}
  <div class="card"><div class="tag">Objective score</div><div class="score">${S.score}/${n}</div><p class="note">${pc}% · ${pc>=70?"Excellent work.":pc>=50?"Good, keep practising the topics you missed.":"Revise the topics below and try again."}</p>
  ${tmax?`<div class="tag">Theory (self-marked)</div><b id="th"></b><div class="tag" style="margin-top:8px">Overall</div><b id="all"></b>`:""}</div>
  <div class="np">${missed.length?`<button id="retry">Retry the ${missed.length} I missed</button>`:""}<button class="alt" id="prt">Print / save results</button><button class="alt" id="again">Back to start</button></div>
  <h2>Objective review</h2>
  ${S.obj.map((q,i)=>`<div class="card"><div class="tag">Question ${i+1} · ${TOP[q.t]}</div><p class="q">${esc(q.q)}</p>
  ${q.o.map((o,j)=>`<div class="opt ${o===q.a?"ok":j===q.p?"bad":""}"><span>${esc(o)}${o===q.a?" ✓":j===q.p?" ✗ (your answer)":""}</span></div>`).join("")}
  ${q.p===null?`<p class="note">You skipped this one.</p>`:""}</div>`).join("")}
  ${tmax?`<h2>Theory: mark yourself</h2><p class="note">Tick each key point your answer covered. Each point is worth 1 mark, up to the maximum.</p>
  ${S.thy.map((q,i)=>`<div class="card"><div class="tag">Theory ${i+1} · max ${q.max} marks</div><p class="q">${esc(q.q)}</p>
  <div class="ans">${q.txt.trim()?esc(q.txt):"<i>No answer written.</i>"}</div>
  <div class="pts"><b style="display:block;margin:10px 0 4px">Marking guide</b>${q.pts.map((p,k)=>`<label><input type="checkbox" data-i="${i}" data-k="${k}"><span>${esc(p)}</span></label>`).join("")}</div></div>`).join("")}`:""}`;
  $("#again").onclick=home;$("#prt").onclick=()=>window.print();
  if($("#retry"))$("#retry").onclick=()=>begin(missed.map(q=>q.src),[],Math.max(5,Math.ceil(missed.length*1.5)),"Retry missed");
  if(tmax)calc();
}
function calc(sv){
  const tmax=S.thy.reduce((a,q)=>a+q.max,0);
  const t=S.thy.reduce((a,q)=>a+Math.min(q.max,q.tk.filter(Boolean).length),0);
  if(sv){S.rec.th=t;saveRec(S.rec)}
  $("#th").textContent=`${t} / ${tmax}`;
  $("#all").textContent=`${S.score+t} / ${S.obj.length+tmax}`;
}

function report(){
  clearInterval(timer);S=null;app.onchange=app.oninput=null;
  const h=hist(),pc=(a,n)=>n?Math.round(a/n*100):0,mm=t=>`${Math.floor(t/60)}:${String(t%60).padStart(2,"0")}`;
  const avg=h.length?Math.round(h.reduce((a,r)=>a+pc(r.s,r.n),0)/h.length):0,best=h.reduce((a,r)=>Math.max(a,pc(r.s,r.n)),0);
  const ts={};h.forEach(r=>Object.entries(r.tp||{}).forEach(([k,v])=>{const key=r.subj+"|"+k,c=ts[key]=ts[key]||[0,0];c[0]+=v[0];c[1]+=v[1]}));
  const rows=Object.entries(ts).map(([key,v])=>{const[sj,k]=key.split("|"),sb=SUBJECTS[sj]||{short:sj,TOP:{}};return{n:sb.short+" · "+(sb.TOP[k]||k),p:pc(v[0],v[1]),c:v}}).sort((a,b)=>a.p-b.p);
  app.innerHTML=`<div class="np"><button class="alt" id="bk" style="margin-top:12px">Back</button></div>
  <h2>Progress report</h2>
  <div class="card"><label for="nm">Student name</label><input class="tx" id="nm" type="text" value="${esc(lsGet("jss3name")||"")}" placeholder="Type your name">
  <p class="note" style="margin:10px 0 0">Report date: ${new Date().toLocaleDateString()}</p></div>
  ${h.length?`<div class="card"><b>Tests taken:</b> ${h.length}<br><b>Average objective score:</b> ${avg}%<br><b>Best objective score:</b> ${best}%</div>
  <h2>Topics, weakest first</h2><div class="card">${rows.map(r=>`<div class="note">${esc(r.n)}: ${r.p}% (${r.c[0]}/${r.c[1]} correct)</div><div class="b2"><i style="width:${r.p}%;background:${r.p<50?"var(--bad)":r.p<70?"var(--hi)":"var(--ok)"}"></i></div>`).join("")}</div>
  <h2>All tests</h2>${h.map(r=>`<div class="card"><div class="tag">${new Date(r.ts).toLocaleString()}</div><b>${esc((SUBJECTS[r.subj]||{short:r.subj}).short)} · ${esc(r.label)}</b><br>Objective: ${r.s}/${r.n} (${pc(r.s,r.n)}%)${r.tmax?`<br>Theory (self-marked): ${r.th===null?"not marked":r.th+" / "+r.tmax}`:""}<br><span class="note">Time used: ${mm(r.sec||0)}</span></div>`).join("")}
  <div class="np"><button id="rpt">Print / save report</button><button class="alt" id="clr">Clear history</button></div>`
  :`<div class="card">No tests yet. Finish a test and it will appear here.</div>`}`;
  $("#bk").onclick=home;$("#nm").oninput=e=>lsSet("jss3name",e.target.value);
  if(h.length){$("#rpt").onclick=()=>window.print();$("#clr").onclick=()=>{if(confirm("Delete all saved test history on this device?")){lsSet("jss3ca2hist","[]");report()}}}
  scrollTo(0,0);
}

function printPaper(topic){
  const p=pool(topic),L="ABCD",O=p.o.map(q=>({q:q[1],o:shuf(q.slice(2)),a:q[2]}));
  app.onchange=app.oninput=null;
  app.innerHTML=`<div class="np"><button id="p1">Print / save as PDF</button><button class="alt" id="bk">Back</button></div>
  <h2>${SUBJECTS[SUBJ].name}: Mock CA 2</h2><p>Name: ______________________ Class: JSS3 &nbsp; Time: ${MINS} min</p>
  <h2>Section A: Objective</h2>
  ${O.map((q,i)=>`<p class="q">${i+1}. ${esc(q.q)}</p><p>${q.o.map((o,j)=>`${L[j]}. ${esc(o)}`).join(" &nbsp; ")}</p>`).join("")}
  <h2>Section B: Theory (answer all)</h2>
  ${p.t.map((q,i)=>`<p class="q">${i+1}. ${esc(q[1])} (${q[2]} marks)</p><div style="height:110px"></div>`).join("")}
  <div class="pb"></div><h2>Marking guide</h2>
  <p><b>Section A:</b> ${O.map((q,i)=>`${i+1}${L[q.o.indexOf(q.a)]}`).join(", ")}</p>
  ${p.t.map((q,i)=>`<p><b>${i+1}.</b> ${q[3].map(esc).join("; ")}</p>`).join("")}`;
  $("#p1").onclick=()=>window.print();$("#bk").onclick=home;scrollTo(0,0);
}
home();
</script>
