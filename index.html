const pool=topic=>{const f=a=>topic==="all"?a:a.filter(q=>q[0]===topic);let th=f(THY);if(!th.length)th=THY;return{o:shuf(f(OBJ)).slice(0,NOBJ),t:shuf(th).slice(0,NTHY)}};
const mkO=q=>({src:q,t:q[0],q:q[1],a:q[2],o:shuf(q.slice(2)),p:null});
const mkT=q=>({t:q[0],q:q[1],max:q[2],pts:q[3],txt:"",tk:[]});
function begin(o,t,mins,label){
  S={label,subj:SUBJ,id:Date.now(),t0:Date.now(),done:false,end:Date.now()+mins*60000,obj:o.map(mkO),thy:t.map(mkT)};
  scrollTo(0,0);renderTest();timer=setInterval(tick,1000);tick();
}
const start=topic=>{const p=pool(topic);begin(p.o,p.t,MINS,topic==="all"?"All topics":TOP[topic])};

function renderTest(){
  app.innerHTML=`<div class="bar" id="bar"><span id="tm"></span><span id="pr"></span></div>

  app.onchange=e=>{const i=e.target.dataset.i;if(i!==undefined&&!S.done){S.obj[i].p=+e.target.value;prog()}};
  app.oninput=e=>{const t=e.target.dataset.t;if(t!==undefined&&!S.done)S.thy[t].txt=e.target.value};

}
const prog=()=>{const n=S.obj.filter(q=>q.p!==null).length;$("#pr").textContent=`${n}/${S.obj.length} answered`};

function tick(){
  const r=S.end-Date.now();
  if(r<=0){submit(true);return}
  const m=Math.floor(r/60000),s=Math.floor(r%60000/1000);
  $("#tm").textContent=`⏱ ${m}:${String(s).padStart(2,"0")}`;
  $("#bar").classList.toggle("warn",r<5*60000);
}

function submit(auto){
  const un=S.obj.filter(q=>q.p===null).length;
  if(!auto&&un&&!confirm(`${un} objective question(s) unanswered. Submit anyway?`))return;
  clearInterval(timer);S.done=true;
  S.score=S.obj.filter(q=>q.o[q.p]===q.a).length;
  const tp={};S.obj.forEach(q=>{const c=tp[q.t]=tp[q.t]||[0,0];c[1]++;if(q.o[q.p]===q.a)c[0]++});
  S.rec={id:S.id,ts:Date.now(),subj:S.subj,label:S.label,s:S.score,n:S.obj.length,sec:Math.round((Date.now()-S.t0)/1000),tp,th:null,tmax:S.thy.reduce((a,q)=>a+q.max,0)};saveRec(S.rec);
  scrollTo(0,0);renderResult(auto);
}

function renderResult(auto){
  const n=S.obj.length,pc=Math.round(S.score/n*100);

function calc(sv){
  const tmax=S.thy.reduce((a,q)=>a+q.max,0);
  const t=S.thy.reduce((a,q)=>a+Math.min(q.max,q.tk.filter(Boolean).length),0);
  if(sv){S.rec.th=t;saveRec(S.rec)}
  $("#th").textContent=`${t} / ${tmax}`;
  $("#all").textContent=`${S.score+t} / ${S.obj.length+tmax}`;
}
